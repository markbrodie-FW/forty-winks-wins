<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#000000"/><title>Forty Winks Wins</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=20260831-values1"/>
<style>
html,body{background:#000!important}.display-page{padding:10px;box-sizing:border-box}.display-shell{height:calc(100vh - 20px)!important;min-height:0!important;border-radius:28px;overflow:hidden}.screen{border-radius:28px;overflow:hidden}
.celebration-date{margin-top:.55em;font-size:clamp(14px,1.15vw,24px);font-weight:600;color:var(--clear-sky-half)}.celebration-value{display:inline-flex;margin-top:1em;padding:.45em .8em;border:1px solid rgba(255,255,255,.35);border-radius:999px;font-size:clamp(13px,1.2vw,25px);font-weight:800;letter-spacing:.06em;color:#fff}.celebration-value:empty{display:none}.celebration-photo{position:absolute;z-index:5;right:6vw;bottom:11vh;width:min(34vw,700px);max-height:34vh;object-fit:cover;border-radius:24px;box-shadow:0 18px 55px rgba(0,0,0,.25)}.celebration-content.has-photo{right:42vw}.celebration-content.has-photo .celebration-text{max-width:100%}
.reload-button{width:32px;height:32px;border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.08);color:var(--clear-sky-half);display:inline-grid;place-items:center;cursor:pointer;padding:0;flex:0 0 auto}.reload-button svg{width:14px;height:14px;display:block}.celebration-stickers{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}.celebration-sticker{position:absolute;width:clamp(180px,19vw,430px);height:auto;transform-origin:center;transition:opacity .35s ease,transform .45s ease}.celebration-sticker.is-small{width:clamp(130px,14vw,320px)}.celebration-sticker.is-tiny{width:clamp(100px,10vw,240px)}.celebration-sticker.pos-a{top:7%;right:-4%;transform:rotate(12deg)}.celebration-sticker.pos-b{top:10%;left:-5%;transform:rotate(-13deg)}.celebration-sticker.pos-c{bottom:10%;right:-6%;transform:rotate(-8deg)}.celebration-sticker.pos-d{top:8%;left:8%;transform:rotate(9deg)}.celebration-sticker.pos-e{bottom:9%;left:-4%;transform:rotate(14deg)}.celebration-sticker.pos-f{bottom:11%;right:10%;transform:rotate(-10deg)}.screen-celebration.fade .celebration-sticker,.screen-celebration.fade .celebration-photo{opacity:0}.celebration-content{z-index:4}.celebration-topbar,.celebration-footer{z-index:7}
@media(max-width:760px){.display-page{padding:5px}.display-shell{height:calc(100vh - 10px)!important;border-radius:18px}.screen{border-radius:18px}.celebration-photo{width:38vw;right:5vw;bottom:12vh;border-radius:14px}.celebration-content.has-photo{right:46vw}.celebration-value{font-size:10px}.celebration-date{font-size:11px}.celebration-sticker{width:clamp(120px,33vw,190px)}.celebration-sticker.is-small{width:clamp(95px,26vw,150px)}.celebration-sticker.is-tiny{width:clamp(78px,21vw,120px)}}
</style></head><body class="display-page"><div id="displayModePrompt" class="display-mode-prompt" role="dialog" aria-modal="true" aria-labelledby="displayModeTitle"><button id="enterDisplayMode" class="display-mode-button" type="button"><span id="displayModeTitle">Tap to enter display mode</span><small>Fullscreen display</small></button></div><main id="app" class="display-shell" aria-live="polite"><section id="listView" class="screen screen-list"><header class="display-header"><div><div class="eyebrow">Forty Winks</div><h1 id="displayTitle">Our wins</h1></div><div class="header-actions"><button class="ghost-button" data-action="celebrate">Celebrate mode</button><a class="primary-button" href="submit.html">+ Add a win</a></div></header><section class="wins-board" aria-label="Current wins"><div class="wins-board-head"><span>WIN</span><span>WHO</span><span>TEAM</span></div><div id="winsRows" class="wins-rows"></div></section><footer class="display-footer"><div class="stat-strip"><div><span id="winCount" class="stat-number">0</span><span class="stat-label">wins</span></div><div><span id="departmentCount" class="stat-number">0</span><span class="stat-label">teams</span></div></div><div class="footer-progress"><p>Scroll to browse.</p><button class="reload-button" type="button" aria-label="Reload wins" onclick="window.location.reload()">↻</button></div></footer></section><section id="celebrationView" class="screen screen-celebration is-hidden"><header class="celebration-topbar"><div id="celebrationMonth" class="celebration-period"></div></header><div id="celebrationContent" class="celebration-content"><blockquote id="celebrationText" class="celebration-text"></blockquote><div class="celebration-meta"><strong id="celebrationName"></strong><span id="celebrationDepartment"></span></div><div id="celebrationValue" class="celebration-value"></div><div id="celebrationDate" class="celebration-date"></div></div><img id="celebrationPhoto" class="celebration-photo is-hidden" alt="Win photo"/><div id="celebrationStickers" class="celebration-stickers" aria-hidden="true"></div><footer class="celebration-footer"><span id="celebrationCounter"></span><span>Tap to see all wins</span></footer></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260831-values1"></script><script src="app.js?v=20260831-values1"></script><script>WinsApp.initDisplay();WinsApp.initDisplayMode();</script></body></html>
