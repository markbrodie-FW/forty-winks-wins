<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#121FA2" />
  <title>Share a Win — Forty Winks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260831-mobile1" />
  <style>
    .emoji-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.emoji-button,.list-button{border:1px solid rgba(18,31,162,.18);background:#fff;border-radius:999px;padding:7px 11px;font-size:20px;cursor:pointer}.emoji-button:hover,.list-button:hover{background:#e0f2ff}.list-button{font-size:14px;font-weight:800;padding:9px 14px}.tool-divider{width:1px;background:rgba(18,31,162,.16);margin:4px 2px}.optional-note{font-weight:500;opacity:.55}.photo-input{padding:14px;background:#fff;border:1px dashed rgba(18,31,162,.3);border-radius:12px}.value-select{width:100%}
    @media(max-width:760px){.form-page{background:var(--clear-sky-half)}.form-shell{width:100%;padding:0 0 36px}.form-topbar{padding:18px 18px 12px}.mini-brand{font-size:13px}.form-topbar .return-main{font-size:12px}.form-card{margin:0 10px;border-radius:24px;padding:28px 20px 24px;box-shadow:0 12px 35px rgba(10,17,68,.1)}.form-card h1{font-size:clamp(56px,18vw,78px);line-height:.86;margin:.16em 0 .22em}.form-intro{font-size:15px;line-height:1.45}.win-form{gap:20px;margin-top:28px}.form-grid{grid-template-columns:1fr;gap:20px}input,select,textarea{font-size:16px;padding:15px 16px}textarea{min-height:170px}.emoji-row{gap:7px}.emoji-button{font-size:18px;padding:7px 10px}.list-button{font-size:12px;padding:9px 12px}.tool-divider{display:none}.submit-button{width:100%;min-height:58px}.photo-input{font-size:13px}.success-panel h2{font-size:54px}.success-actions{display:grid}.success-actions>*{width:100%}}
  </style>
</head>
<body class="form-page"><main class="form-shell">
  <div class="form-topbar"><a class="mini-brand" href="index.html">FORTY WINKS <span>WINS</span></a><a class="return-main" href="index.html">← Back to wins</a></div>
  <section class="form-card"><p class="eyebrow">Good things deserve airtime.</p><h1>What’s your win?</h1><p class="form-intro">Big, small, team effort or personal milestone — share it and we’ll put it on the office board.</p>
    <form id="winForm" class="win-form">
      <label>Your win<textarea id="winText" required maxlength="220" placeholder="Tell us what happened…"></textarea><span class="field-help"><span id="charCount">0</span>/220</span><div class="emoji-row" aria-label="Formatting and emoji tools"><button id="bulletListButton" class="list-button" type="button" aria-label="Add a bulleted list">• Bulleted list</button><span class="tool-divider" aria-hidden="true"></span><button class="emoji-button" type="button">🎉</button><button class="emoji-button" type="button">👏</button><button class="emoji-button" type="button">🙌</button><button class="emoji-button" type="button">💙</button><button class="emoji-button" type="button">🔥</button><button class="emoji-button" type="button">⭐</button><button class="emoji-button" type="button">🚀</button><button class="emoji-button" type="button">🏆</button><button class="emoji-button" type="button">💪</button><button class="emoji-button" type="button">😴</button></div></label>
      <div class="form-grid"><label>Your name<input id="personName" type="text" required maxlength="80" placeholder="Jane Smith" /></label><label>Your department<input id="department" type="text" required maxlength="60" placeholder="e.g. Marketing" /></label></div>
      <label>Brand value <span class="optional-note">(optional)</span><select id="brandValue" class="value-select"><option value="">No value selected</option><option>BOLDLY AUTHENTIC</option><option>PLAYFULLY INSPIRING</option><option>UNDENIABLY FAMILY</option><option>RELENTLESSLY INNOVATIVE</option><option>PERSONAL</option></select></label>
      <label>Add a photo <span class="optional-note">(optional)</span><input id="winPhoto" class="photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" /><span class="field-help">One image, up to 10 MB.</span></label>
      <label>Date of the win<input id="winDate" type="date" required /><span id="periodHint" class="field-help"></span></label>
      <p id="submitError" class="form-error is-hidden"></p><button class="submit-button" type="submit">Share my win</button>
    </form>
    <div id="submitSuccess" class="success-panel is-hidden" role="status"><div class="success-icon">✓</div><h2>Nice one.</h2><p id="successMessage"></p><div class="success-actions"><button id="submitAnother" class="secondary-button">Share another win</button><a class="return-main secondary-button" href="index.html">Back to wins</a></div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260831-mobile1"></script><script src="app.js?v=20260831-mobile1"></script><script>WinsApp.initSubmit();</script>
</body></html>
