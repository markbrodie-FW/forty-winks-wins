<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export wins — Forty Winks</title><link rel="stylesheet" href="styles.css">
<style>
body{background:#e0f2ff;color:#0a1144;font-family:Inter,Arial,sans-serif}.export-shell{max-width:1000px;margin:36px auto 80px;padding:0 20px}.export-controls{background:white;padding:24px;border-radius:22px;display:grid;gap:18px;box-shadow:0 12px 35px #0a114422}.export-controls h1{font-size:32px;margin:0}.export-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.export-fields label{display:grid;gap:6px;font-size:13px;font-weight:750}.export-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.export-actions button{cursor:pointer}.export-check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700}.export-check input{width:auto}.export-help{font-size:13px;color:#5d6590;margin:0}.report{background:#fff;margin-top:24px;padding:48px;border-radius:12px}.report-header{border-bottom:4px solid #121fa2;padding-bottom:22px;margin-bottom:28px}.report-kicker{font-size:12px;font-weight:900;letter-spacing:.08em;color:#121fa2}.report h1{font-size:38px;line-height:1;margin:10px 0}.report-subtitle{font-size:14px;color:#53608c}.report-month{font-size:22px;margin:34px 0 15px;border-bottom:2px solid #e0f2ff;padding-bottom:9px;color:#121fa2;break-after:avoid}.report-win{padding:17px 0 20px;border-bottom:1px solid #dce2ef;break-inside:avoid;page-break-inside:avoid}.report-win-text{font-size:17px;line-height:1.45;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 11px}.report-meta{font-size:12px;line-height:1.5;color:#57638a}.report-meta strong{color:#0a1144}.report-photo{display:block;max-width:100%;max-height:250px;object-fit:contain;margin:12px 0;border-radius:9px}.report-status{font-size:11px;color:#8a4e61}.report-empty{padding:30px 0;color:#5d6590}.report-footer{font-size:11px;color:#657097;margin-top:30px}.is-hidden{display:none!important}@media(max-width:650px){.export-fields{grid-template-columns:1fr}.report{padding:26px}.report h1{font-size:30px}}@media print{@page{size:A4;margin:15mm}html,body{background:white!important;margin:0;color:#0a1144;-webkit-print-color-adjust:exact;print-color-adjust:exact}.export-shell{max-width:none;margin:0;padding:0}.export-controls{display:none!important}.report{margin:0;padding:0;border-radius:0;box-shadow:none}.report-header{padding-bottom:16px;margin-bottom:18px}.report h1{font-size:30px}.report-month{font-size:19px}.report-win-text{font-size:13px}.report-win{padding:12px 0 14px}.report-photo{max-height:180px}.report-footer{margin-top:18px}} 
</style></head><body><main class="export-shell"><section class="export-controls"><a class="mini-brand" href="admin.html">← Back to wins admin</a><h1>Export wins</h1><p class="export-help">Choose a period, then print or save this report as a PDF. Dates refer to the date of each win, not when it was submitted.</p><div class="export-fields"><label>From date<input id="fromDate" type="date"></label><label>To date<input id="toDate" type="date"></label></div><label class="export-check"><input id="includeHidden" type="checkbox"> Include hidden wins</label><label class="export-check"><input id="includePhotos" type="checkbox" checked> Include photos</label><div class="export-actions"><button id="allDates" class="secondary-button" type="button">All dates</button><button id="thisMonth" class="secondary-button" type="button">This month</button><button id="printReport" class="primary-button" type="button">Print / Save as PDF</button></div><p id="exportMessage" class="export-help" role="status">Loading wins…</p></section><article id="report" class="report"><header class="report-header"><div class="report-kicker">FORTY WINKS · TEAM WINS</div><h1>Our wins</h1><div id="reportSubtitle" class="report-subtitle"></div></header><div id="reportBody"></div><footer class="report-footer">Forty Winks · Team wins report</footer></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script>
(async function(){
const byId=id=>document.getElementById(id),from=byId('fromDate'),to=byId('toDate'),hidden=byId('includeHidden'),photos=byId('includePhotos'),body=byId('reportBody'),msg=byId('exportMessage');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=s=>date(s).toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
const month=s=>date(s).toLocaleDateString('en-AU',{month:'long',year:'numeric'});
const today=new Date(),iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
let wins=[];const imageCache=new Map();
async function compactImage(url){
 if(imageCache.has(url))return imageCache.get(url);
 const task=(async()=>{try{
  const response=await fetch(url,{mode:'cors'});if(!response.ok)throw new Error('Image fetch failed');
  const blob=await response.blob();const bitmap=await createImageBitmap(blob);
  const scale=Math.min(1,1100/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();
  return canvas.toDataURL('image/jpeg',0.72);
 }catch(e){console.warn('Could not compress image for export',e);return url}})();
 imageCache.set(url,task);return task;
}
async function prepareImages(){
 const imgs=[...body.querySelectorAll('img.report-photo')];
 if(!imgs.length)return;
 msg.textContent='Optimising '+imgs.length+' photos for PDF…';
 await Promise.all(imgs.map(async img=>{const url=img.dataset.original||img.src;img.dataset.original=url;img.src=await compactImage(url)}));
}
function render(){
const a=from.value,b=to.value;if(a&&b&&a>b){msg.textContent='The from date must be before the to date.';body.innerHTML='';byId('printReport').disabled=true;return}
const filtered=wins.filter(w=>(hidden.checked||w.status!=='hidden')&&(!a||w.date>=a)&&(!b||w.date<=b)).sort((x,y)=>y.date.localeCompare(x.date)||x.name.localeCompare(y.name));
byId('printReport').disabled=!filtered.length;
msg.textContent=filtered.length+' win'+(filtered.length===1?'':'s')+' in report';
byId('reportSubtitle').textContent=(a?fmt(a):'All dates')+' – '+(b?fmt(b):'present')+' · '+filtered.length+' wins'+(hidden.checked?' · Includes hidden wins':'');
if(!filtered.length){body.innerHTML='<p class="report-empty">No wins match this date range.</p>';return}
let last='';body.innerHTML=filtered.map(w=>{const m=month(w.date);let heading='';if(m!==last){last=m;heading='<h2 class="report-month">'+esc(m)+'</h2>'}return heading+'<section class="report-win"><p class="report-win-text">'+esc(w.text)+'</p>'+(photos.checked&&w.photo?'<img class="report-photo" src="'+esc(w.photo)+'" alt="Photo attached to win">':'')+'<div class="report-meta"><strong>'+esc(w.name)+'</strong> · '+esc(w.department)+' · '+esc(fmt(w.date))+(w.value?' · '+esc(w.value):'')+(w.status==='hidden'?' <span class="report-status">· Hidden</span>':'')+'</div></section>'}).join('');
}
[from,to,hidden,photos].forEach(el=>el.addEventListener('change',render));
byId('allDates').addEventListener('click',()=>{from.value='';to.value='';render()});
byId('thisMonth').addEventListener('click',()=>{from.value=iso(new Date(today.getFullYear(),today.getMonth(),1));to.value=iso(today);render()});
byId('printReport').addEventListener('click',async()=>{const btn=byId('printReport');btn.disabled=true;try{await prepareImages();const imgs=[...body.querySelectorAll('img')];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,2500)})));msg.textContent='Photos optimised. Opening print dialog…';window.print()}finally{btn.disabled=false}});
try{wins=await WinsApp.Store.all(true);render()}catch(e){msg.textContent='Could not load wins. Please refresh and try again.';byId('printReport').disabled=true;console.error(e)}
})();
</script></body></html>
